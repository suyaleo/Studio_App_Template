services:
  studio-app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        VCS_REF: ${VCS_REF:-local}
    image: ghcr.io/suyaleo/studio-app-template:${IMAGE_TAG:-local}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8000/v1}
      AI_PROFILE: ${AI_PROFILE:-studio-app-template}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studio-data:/data
    restart: unless-stopped

volumes:
  studio-data:
