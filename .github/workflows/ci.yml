name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install API dependencies
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt

      - name: Validate Studio release contract
        run: python scripts/validate_studio_repo.py --mode release

      - name: Test API
        run: python -m pytest api/tests

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Check Web
        working-directory: web
        run: npm run check

      - name: Build Docker image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg APP_VERSION=0.1.0 -t studio-app-template:ci .

      - name: Inspect non-root runtime and OCI labels
        run: |
          test "$(docker image inspect studio-app-template:ci --format '{{.Config.User}}')" = "studio"
          test "$(docker image inspect studio-app-template:ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = "Apache-2.0"

  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Start Compose app
        run: docker compose up --build --wait

      - name: Exercise primary API path
        run: |
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080/api/health
          curl --fail --request POST http://127.0.0.1:8080/api/preflight

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose app
        if: always()
        run: docker compose down --volumes
